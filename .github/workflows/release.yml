name: Release

# Push a tag like v1.0.0 (or v1.0.0-rc.1 for a pre-release) to build, sign and publish an APK.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:engine:jvmTest :core:data:jvmTest --no-daemon
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOWNLY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/downly.jks"
      - name: Build the signed release APK
        env:
          DOWNLY_KEYSTORE: ${{ runner.temp }}/downly.jks
          DOWNLY_KEYSTORE_PASSWORD: ${{ secrets.DOWNLY_KEYSTORE_PASSWORD }}
          DOWNLY_KEY_ALIAS: ${{ secrets.DOWNLY_KEY_ALIAS }}
          DOWNLY_KEY_PASSWORD: ${{ secrets.DOWNLY_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon
      - name: Name the APK and write its checksum
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*.apk "dist/Downly-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "Downly-${GITHUB_REF_NAME}.apk" > "Downly-${GITHUB_REF_NAME}.apk.sha256")
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
