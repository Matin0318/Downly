name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (engine, data)
        run: ./gradlew :core:engine:jvmTest :core:data:jvmTest --no-daemon
      - name: Build release APK (unsigned: checks the R8 rules)
        run: ./gradlew :androidApp:assembleRelease --no-daemon
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: downly-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
