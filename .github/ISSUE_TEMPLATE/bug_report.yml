name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Downly version (Settings > About)
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do, what did you expect, what happened?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Crash log
      description: If the app crashed, paste the content of last_crash.txt (Android/data/app.downly.android/files/).
